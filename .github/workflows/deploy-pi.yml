name: Deploy to Raspberry Pi on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  deploy-pi:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
    - name: 🔍 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Set up Docker Buildx for ARM
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/arm64,linux/arm/v7

    - name: 🔐 Set up SSH for Raspberry Pi
      env:
        PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        mkdir -p ~/.ssh
        echo "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_rsa
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/pi_rsa
        ssh-keyscan -H $PI_HOST >> ~/.ssh/known_hosts

    - name: 🏗️ Build ARM image for Raspberry Pi
      run: |
        docker buildx create --use --name pi-builder
        docker buildx build \
          --platform linux/arm64 \
          -f Dockerfile.prod \
          -t blog_tech_django:pi-${{ github.event.pull_request.number }} \
          --load .

    - name: 💾 Save Docker image
      run: |
        docker save blog_tech_django:pi-${{ github.event.pull_request.number }} | gzip > django-pi.tar.gz

    - name: 📦 Copy files to Raspberry Pi
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        # Create deployment directory for this PR
        ssh -i ~/.ssh/pi_rsa $PI_USER@$PI_HOST "mkdir -p ~/deployments/pr-${{ github.event.pull_request.number }}"
        
        # Copy application files
        scp -i ~/.ssh/pi_rsa -r \
          blog_heho \
          docker-compose.yml \
          docker-compose.pi.yml \
          nginx.pi.conf \
          Dockerfile.prod \
          requirements.prod.txt \
          wait-for-it.sh \
          django-pi.tar.gz \
          $PI_USER@$PI_HOST:~/deployments/pr-${{ github.event.pull_request.number }}/

    - name: 🌱 Set up environment on Raspberry Pi
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
        DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        ssh -i ~/.ssh/pi_rsa $PI_USER@$PI_HOST "
          cd ~/deployments/pr-${{ github.event.pull_request.number }}
          
          # Create .env file for this PR deployment
          cat > .env << EOF
          DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,$PI_HOST
          DJANGO_TRUSTED_ORIGINS=http://localhost,http://127.0.0.1,http://$PI_HOST
          DB_NAME=${DB_NAME:-testdb_pr_${{ github.event.pull_request.number }}}
          DB_USER=${DB_USER:-testuser}
          DB_PASSWORD=${DB_PASSWORD:-testpassword}
          COMPOSE_PROJECT_NAME=blog_pr_${{ github.event.pull_request.number }}
          EOF
          
          # Load the Docker image
          docker load < django-pi.tar.gz
          
          # Tag the image appropriately
          docker tag blog_tech_django:pi-${{ github.event.pull_request.number }} blog_tech_django:pi
        "

    - name: 🚀 Deploy with Docker Compose on Raspberry Pi
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        ssh -i ~/.ssh/pi_rsa $PI_USER@$PI_HOST "
          cd ~/deployments/pr-${{ github.event.pull_request.number }}
          
          # Stop any existing deployment for this PR
          docker-compose -f docker-compose.yml -f docker-compose.pi.yml --env-file .env down --remove-orphans || true
          
          # Start the new deployment
          docker-compose -f docker-compose.yml -f docker-compose.pi.yml --env-file .env up -d
          
          # Wait for services to be healthy
          sleep 30
          
          # Check if services are running
          docker-compose -f docker-compose.yml -f docker-compose.pi.yml --env-file .env ps
        "

    - name: 🧪 Health check
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        ssh -i ~/.ssh/pi_rsa $PI_USER@$PI_HOST "
          cd ~/deployments/pr-${{ github.event.pull_request.number }}
          
          # Get the mapped port for nginx
          NGINX_PORT=\$(docker-compose -f docker-compose.yml -f docker-compose.pi.yml --env-file .env port nginx 80 | cut -d: -f2)
          
          # Health check
          sleep 10
          curl -f http://localhost:\$NGINX_PORT/health/ || exit 1
          
          echo '✅ Deployment successful! Access your PR at: http://$PI_HOST:\$NGINX_PORT'
        "

    - name: 💬 Comment on PR
      uses: actions/github-script@v7
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
      with:
        script: |
          const prNumber = context.payload.pull_request.number;
          const deploymentUrl = `http://${{ env.PI_HOST }}`;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🎉 **PR Deployment Successful!** 
            
            Your pull request has been deployed to the Raspberry Pi for testing:
            - **Deployment URL**: ${deploymentUrl}
            - **PR Number**: #${prNumber}
            - **Branch**: ${{ github.head_ref }}
            - **Commit**: ${{ github.event.pull_request.head.sha }}
            
            The deployment will be automatically cleaned up when the PR is closed or merged.`
          });

  cleanup-on-close:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
    - name: 🔐 Set up SSH for Raspberry Pi
      env:
        PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
        PI_HOST: ${{ secrets.PI_HOST }}
      run: |
        mkdir -p ~/.ssh
        echo "$PI_SSH_PRIVATE_KEY" > ~/.ssh/pi_rsa
        chmod 700 ~/.ssh
        chmod 600 ~/.ssh/pi_rsa
        ssh-keyscan -H $PI_HOST >> ~/.ssh/known_hosts

    - name: 🧹 Cleanup PR deployment
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        ssh -i ~/.ssh/pi_rsa $PI_USER@$PI_HOST "
          cd ~/deployments/pr-${{ github.event.pull_request.number }} || exit 0
          
          # Stop and remove containers
          docker-compose -f docker-compose.yml -f docker-compose.pi.yml --env-file .env down --volumes --remove-orphans || true
          
          # Remove deployment directory
          cd ~/deployments
          rm -rf pr-${{ github.event.pull_request.number }}
          
          # Clean up unused Docker images and volumes
          docker image prune -f
          docker volume prune -f
          
          echo '🧹 Cleanup completed for PR #${{ github.event.pull_request.number }}'
        " || echo "Deployment directory not found or already cleaned up"