version: '3.8'

services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.prod
      # Use buildx for multi-platform builds if needed
    image: blog_tech_django:pi
    environment:
      - DJANGO_SETTINGS_MODULE=blog_heho.settings.production
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_TRUSTED_ORIGINS=${DJANGO_TRUSTED_ORIGINS}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-testdb}
      - DB_USER=${DB_USER:-testuser}
      - DB_PASSWORD=${DB_PASSWORD:-testpassword}
      - DB_PORT=5432
    command: |
      bash -c "printenv && \
      ./wait-for-it.sh postgres:5432 && \
      python blog_heho/manage.py makemigrations blog && \
      python blog_heho/manage.py migrate --no-input && \
      python blog_heho/manage.py collectstatic --noinput && \
      gunicorn --chdir /app/blog_heho/ blog_heho.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    volumes:
      - pi_static:/app/blog_heho/staticfiles
      - pi_media:/app/blog_heho/media
    depends_on:
      - postgres
    networks:
      - app_network
    restart: unless-stopped
    # Resource limits for Raspberry Pi
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-testdb}
      POSTGRES_USER: ${DB_USER:-testuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testpassword}
    volumes:
      - pi_postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    restart: unless-stopped
    # Resource limits for Raspberry Pi
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-testuser}", "-d", "${DB_NAME:-testdb}"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.pi.conf:/etc/nginx/nginx.conf:ro
      - pi_static:/var/www/static:ro
      - pi_media:/var/www/media:ro
      - pi_ssl:/etc/nginx/ssl:ro
    depends_on:
      - django
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    driver: bridge

volumes:
  pi_postgres_data:
    driver: local
  pi_static:
    driver: local
  pi_media:
    driver: local
  pi_ssl:
    driver: local